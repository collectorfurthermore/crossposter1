name: Test Bluesky link previews (no publishing)

on:
  pull_request:
    paths:
      - "crosspost.py"
      - "link_preview.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/preview-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests only
        run: python -m unittest discover -s tests -v
      - name: Inspect real-site preview metadata without publishing
        run: python tests/smoke_real_urls.py
